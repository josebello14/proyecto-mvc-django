<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - Django</title>
</head>
    <h1>Mis Tareas (CRUD NoSQL)</h1>
    <form method="post">
        {% csrf_token %}
        <input type="text" name="titulo_tarea" placeholder="Nueva tarea..." required>
        <button type="submit">Guardar</button>
    </form>
    <hr>
    <ul>
        {% for tarea in tareas %}
                {{ tarea.titulo }} -
                Estado: {% if tarea.completada %} Lista {% else %} Pendiente {% endif %}
                <a href="{% url 'completar' tarea.id %}">
                    <button>Cambiar Estado</button>
                </a>

                <a href="{% url 'eliminar' tarea.id %}">
                    <button>Eliminar</button>
                </a>
            </li>
        {% empty %}
            <li>No hay tareas registradas aun.</li>
        {% endfor %}
    </ul>
</body>
</html>
